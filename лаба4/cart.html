<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | Dota 2 Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(118, 56, 56, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(56, 76, 118, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 59, 59, 0.2);
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3b3b 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(255, 59, 59, 0.3);
        }

        /* Navigation */
        .nav {
            background: rgba(5, 7, 13, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 59, 59, 0.15);
            position: sticky;
            top: 80px;
            z-index: 99;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            padding: 1rem 0;
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: #ff3b3b;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(135deg, #ff3b3b 0%, #ff8c00 100%);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Cart Title */
        .cart-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        /* Cart Grid */
        .cart-grid {
            background: linear-gradient(135deg, rgba(20, 25, 40, 0.8), rgba(15, 18, 30, 0.9));
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 59, 59, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        /* Cart Header */
        .cart-header {
            background: linear-gradient(135deg, rgba(255, 59, 59, 0.15), rgba(255, 140, 0, 0.1));
            color: #ff8c00;
            padding: 1.25rem;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 0.5fr;
            gap: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 59, 59, 0.2);
        }

        /* Cart Items */
        .cart-items {
            max-height: 500px;
            overflow-y: auto;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 0.5fr;
            gap: 1rem;
            padding: 1.25rem;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .cart-item:hover {
            background: rgba(255, 59, 59, 0.05);
            transform: translateX(5px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-name {
            font-weight: 600;
            color: #fff;
            font-size: 1rem;
        }

        .product-price {
            color: #ff8c00;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .product-quantity {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 59, 59, 0.3);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            color: #fff;
        }

        .quantity-btn:hover {
            background: linear-gradient(135deg, #ff3b3b, #cc2b2b);
            border-color: transparent;
            transform: scale(1.05);
            color: white;
        }

        .quantity-value {
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .remove-btn {
            background: rgba(255, 59, 59, 0.2);
            border: 1px solid rgba(255, 59, 59, 0.3);
            padding: 0.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            width: 40px;
            color: #ff3b3b;
        }

        .remove-btn:hover {
            background: rgba(255, 59, 59, 0.4);
            transform: scale(1.1);
            border-color: #ff3b3b;
        }

        /* Cart Footer */
        .cart-footer {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-top: 1px solid rgba(255, 59, 59, 0.2);
        }

        .total-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff8c00 0%, #ff3b3b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .checkout-btn {
            background: linear-gradient(135deg, #ff3b3b 0%, #cc2b2b 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 59, 59, 0.4);
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 59, 59, 0.5);
        }

        /* Empty Cart */
        .empty-cart {
            background: linear-gradient(135deg, rgba(20, 25, 40, 0.8), rgba(15, 18, 30, 0.9));
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 4rem 2rem;
            text-align: center;
            border: 1px solid rgba(255, 59, 59, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .empty-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .empty-title {
            font-size: 1.8rem;
            color: white;
            margin-bottom: 1rem;
        }

        .empty-text {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .continue-shopping {
            display: inline-block;
            background: linear-gradient(135deg, #ff3b3b 0%, #cc2b2b 100%);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .continue-shopping:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 59, 59, 0.4);
        }

        /* Scrollbar */
        .cart-items::-webkit-scrollbar {
            width: 8px;
        }

        .cart-items::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .cart-items::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff3b3b 0%, #ff8c00 100%);
            border-radius: 4px;
        }

        /* Modal Order Form */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .order-modal {
            background: linear-gradient(135deg, #1a1f2e, #0f1220);
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 59, 59, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .order-modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 59, 59, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ff8c00;
        }

        .modal-close {
            background: rgba(255, 59, 59, 0.2);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #ff3b3b;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 59, 59, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff3b3b;
            background: rgba(255, 59, 59, 0.1);
        }

        .form-group input.error {
            border-color: #ff3b3b;
            background: rgba(255, 59, 59, 0.15);
        }

        .error-message {
            color: #ff3b3b;
            font-size: 0.75rem;
            margin-top: 0.3rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1.5rem 0;
        }

        .checkbox-group input {
            width: auto;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .checkbox-group a {
            color: #ff8c00;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff3b3b 0%, #cc2b2b 100%);
            border: none;
            padding: 1rem;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 59, 59, 0.4);
        }

        .order-summary {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .order-summary p {
            margin: 0.3rem 0;
            color: #94a3b8;
        }

        .order-summary strong {
            color: #ff8c00;
            font-size: 1.2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cart-header {
                display: none;
            }

            .cart-item {
                grid-template-columns: 1fr;
                gap: 0.75rem;
                padding: 1rem;
            }

            .product-name {
                font-size: 1.1rem;
            }

            .cart-footer {
                flex-direction: column;
                text-align: center;
            }

            .nav-content {
                justify-content: center;
            }

            .order-modal {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-content">
        <div class="logo">🗡️ Dota 2 Skin Store</div>
    </div>
</header>

<nav class="nav">
    <div class="nav-content">
        <a href="index.html" class="nav-link">🏠 Главная</a>
        <a href="catalog.html" class="nav-link">📦 Каталог</a>
        <a href="cart.html" class="nav-link">🛒 Корзина</a>
    </div>
</nav>

<div class="container">
    <h1 class="cart-title">🛍️ Моя корзина</h1>
    <div id="cart"></div>
</div>

<!-- Modal Order Form -->
<div class="modal-overlay" id="orderModal">
    <div class="order-modal">
        <div class="modal-header">
            <span class="modal-title">💰 Оформление заказа</span>
            <button class="modal-close" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body">
            <div class="order-summary" id="orderSummary">
                <!-- Сумма заказа будет подставлена через JS -->
            </div>
            
            <form id="orderForm">
                <div class="form-group">
                    <label>💳 Номер карты</label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                    <div class="error-message" id="cardError">Введите корректный номер карты (16 цифр)</div>
                </div>

                <div class="form-group">
                    <label>🎮 Логин Steam</label>
                    <input type="text" id="steamLogin" placeholder="Ваш логин в Steam">
                    <div class="error-message" id="steamError">Введите логин Steam</div>
                </div>

                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="example@mail.com">
                    <div class="error-message" id="emailError">Введите корректный email</div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreement">
                    <label>Я принимаю <a href="#" id="termsLink">пользовательское соглашение</a></label>
                </div>
                <div class="error-message" id="agreementError" style="margin-top: -10px; margin-bottom: 10px;">Подтвердите согласие</div>

                <button type="submit" class="submit-btn">✅ Подтвердить заказ</button>
            </form>
        </div>
    </div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function removeFromCart(index) {
    if (confirm('Удалить товар из корзины?')) {
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
    }
}

function updateQuantity(index, change) {
    if (cart[index]) {
        let newQuantity = (cart[index].quantity || 1) + change;
        if (newQuantity >= 1) {
            cart[index].quantity = newQuantity;
            localStorage.setItem("cart", JSON.stringify(cart));
            renderCart();
        }
    }
}

function renderCart() {
    let cartContainer = document.getElementById("cart");
    
    if (cart.length === 0) {
        cartContainer.innerHTML = `
            <div class="empty-cart">
                <div class="empty-icon">🛒</div>
                <h2 class="empty-title">Корзина пуста</h2>
                <p class="empty-text">Похоже, вы еще не добавили ни одного товара</p>
                <a href="catalog.html" class="continue-shopping">✨ Продолжить покупки</a>
            </div>
        `;
    } else {
        let total = 0;
        let cartHtml = `
            <div class="cart-grid">
                <div class="cart-header">
                    <div>Товар</div>
                    <div>Цена</div>
                    <div>Количество</div>
                    <div>Действие</div>
                </div>
                <div class="cart-items">
        `;
        
        cart.forEach((item, index) => {
            let quantity = item.quantity || 1;
            let itemTotal = item.price * quantity;
            total += itemTotal;
            
            cartHtml += `
                <div class="cart-item">
                    <div class="product-name">${escapeHtml(item.name)}</div>
                    <div class="product-price">${item.price.toLocaleString('ru-RU')} ₽</div>
                    <div class="product-quantity">
                        <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">−</button>
                        <span class="quantity-value">${quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                    </div>
                    <div>
                        <button class="remove-btn" onclick="removeFromCart(${index})" title="Удалить">🗑️</button>
                    </div>
                </div>
            `;
        });
        
        cartHtml += `
                </div>
                <div class="cart-footer">
                    <div>
                        <span class="total-label">Общая сумма:</span>
                        <span class="total-amount">${total.toLocaleString('ru-RU')} ₽</span>
                    </div>
                    <button class="checkout-btn" onclick="openOrderModal()">💳 Оформить заказ</button>
                </div>
            </div>
        `;
        
        cartContainer.innerHTML = cartHtml;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Функция форматирования номера карты (добавляет пробелы)
function formatCardNumber(value) {
    let v = value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
    let matches = v.match(/\d{4,16}/g);
    let match = matches && matches[0] || '';
    let parts = [];
    for (let i = 0, len = match.length; i < len; i += 4) {
        parts.push(match.substring(i, i + 4));
    }
    if (parts.length) {
        return parts.join(' ');
    } else {
        return value;
    }
}

// Открытие модального окна
function openOrderModal() {
    const total = cart.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
    document.getElementById('orderSummary').innerHTML = `
        <p>Количество товаров: ${cart.reduce((sum, item) => sum + (item.quantity || 1), 0)} шт.</p>
        <p>Сумма к оплате: <strong>${total.toLocaleString('ru-RU')} ₽</strong></p>
    `;
    
    // Очищаем поля формы
    document.getElementById('cardNumber').value = '';
    document.getElementById('steamLogin').value = '';
    document.getElementById('email').value = '';
    document.getElementById('agreement').checked = false;
    
    // Убираем ошибки
    document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
    
    document.getElementById('orderModal').classList.add('active');
}

// Закрытие модального окна
function closeModal() {
    document.getElementById('orderModal').classList.remove('active');
}

// Валидация формы
function validateForm() {
    let isValid = true;
    
    // Валидация номера карты (только цифры, 16 цифр)
    const cardNumber = document.getElementById('cardNumber');
    const cardValue = cardNumber.value.replace(/\s/g, '');
    if (!/^\d{16}$/.test(cardValue)) {
        cardNumber.classList.add('error');
        document.getElementById('cardError').classList.add('show');
        isValid = false;
    } else {
        cardNumber.classList.remove('error');
        document.getElementById('cardError').classList.remove('show');
    }
    
    // Валидация логина Steam (не пустой)
    const steamLogin = document.getElementById('steamLogin');
    if (steamLogin.value.trim() === '') {
        steamLogin.classList.add('error');
        document.getElementById('steamError').classList.add('show');
        isValid = false;
    } else {
        steamLogin.classList.remove('error');
        document.getElementById('steamError').classList.remove('show');
    }
    
    // Валидация email
    const email = document.getElementById('email');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email.value)) {
        email.classList.add('error');
        document.getElementById('emailError').classList.add('show');
        isValid = false;
    } else {
        email.classList.remove('error');
        document.getElementById('emailError').classList.remove('show');
    }
    
    // Валидация чекбокса
    const agreement = document.getElementById('agreement');
    if (!agreement.checked) {
        document.getElementById('agreementError').classList.add('show');
        isValid = false;
    } else {
        document.getElementById('agreementError').classList.remove('show');
    }
    
    return isValid;
}

// Обработчик отправки формы
function handleSubmit(e) {
    e.preventDefault();
    
    if (validateForm()) {
        const total = cart.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
        
        // Показываем сообщение об успешном заказе
        alert(`✅ ЗАКАЗ ОФОРМЛЕН! ✅\n\nСпасибо за покупку!\n\nСумма: ${total.toLocaleString('ru-RU')} ₽\nЛогин Steam: ${document.getElementById('steamLogin').value}\nEmail: ${document.getElementById('email').value}\n\nПредметы будут отправлены в течение 5 минут.\n\n(Это демонстрационная форма, данные никуда не отправляются)`);
        
        // Очищаем корзину
        localStorage.removeItem("cart");
        cart = [];
        renderCart();
        
        // Закрываем модальное окно
        closeModal();
    }
}

// Форматирование номера карты при вводе
document.addEventListener('DOMContentLoaded', () => {
    const cardInput = document.getElementById('cardNumber');
    if (cardInput) {
        cardInput.addEventListener('input', function(e) {
            let formatted = formatCardNumber(this.value);
            this.value = formatted;
        });
    }
});

// Обработчики для модального окна
document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
document.getElementById('orderModal')?.addEventListener('click', (e) => {
    if (e.target === document.getElementById('orderModal')) closeModal();
});
document.getElementById('orderForm')?.addEventListener('submit', handleSubmit);

// Пользовательское соглашение (просто уведомление)
document.getElementById('termsLink')?.addEventListener('click', (e) => {
    e.preventDefault();
    alert("📋 ПОЛЬЗОВАТЕЛЬСКОЕ СОГЛАШЕНИЕ\n\n1. Все предметы виртуальные и поступают в ваш инвентарь Steam.\n2. Возврат средств возможен в течение 14 дней.\n3. Оформляя заказ, вы соглашаетесь с условиями.\n4. Мы не передаём ваши данные третьим лицам.\n\n(Демонстрационное соглашение)");
});

// Добавляем поддержку количества для старых товаров
cart = cart.map(item => {
    if (!item.quantity) item.quantity = 1;
    return item;
});
localStorage.setItem("cart", JSON.stringify(cart));

renderCart();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Dota 2 Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(118, 56, 56, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(56, 76, 118, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 59, 59, 0.2);
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3b3b 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(255, 59, 59, 0.3);
        }

        /* Navigation */
        .nav {
            background: rgba(5, 7, 13, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 59, 59, 0.15);
            position: sticky;
            top: 80px;
            z-index: 99;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            padding: 1rem 0;
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: #ff3b3b;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(135deg, #ff3b3b 0%, #ff8c00 100%);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Catalog Title */
        .catalog-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .catalog-subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        /* Filters */
        .filters {
            background: linear-gradient(135deg, rgba(20, 25, 40, 0.8), rgba(15, 18, 30, 0.9));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 59, 59, 0.2);
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 59, 59, 0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 10px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: rgba(255, 59, 59, 0.2);
            color: white;
            border-color: #ff3b3b;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ff3b3b, #cc2b2b);
            color: white;
            border-color: transparent;
        }

        /* Products Grid */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Card */
        .card {
            background: linear-gradient(135deg, rgba(20, 25, 40, 0.8), rgba(15, 18, 30, 0.9));
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 59, 59, 0.2);
            position: relative;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            cursor: pointer;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }
        .card:nth-child(7) { animation-delay: 0.7s; }
        .card:nth-child(8) { animation-delay: 0.8s; }
        .card:nth-child(9) { animation-delay: 0.9s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 59, 59, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 59, 59, 0.5);
            box-shadow: 0 20px 40px rgba(255, 59, 59, 0.2);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.4s ease;
            pointer-events: none;
        }

        .card:hover .card-image {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
            pointer-events: auto;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .price {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff8c00 0%, #ff3b3b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .add-to-cart {
            width: 100%;
            background: linear-gradient(135deg, #ff3b3b 0%, #cc2b2b 100%);
            border: none;
            padding: 0.8rem;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .add-to-cart::before {
            content: '🛒';
            margin-right: 8px;
        }

        .add-to-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 59, 59, 0.4);
        }

        .add-to-cart:active {
            transform: translateY(0);
        }

        /* Badge */
        .rare-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 1;
            pointer-events: none;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            z-index: 1001;
            animation: slideIn 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Modal Window */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: linear-gradient(135deg, #1a1f2e, #0f1220);
            border-radius: 24px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            overflow: hidden;
            border: 1px solid rgba(255, 59, 59, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 59, 59, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ff8c00;
        }

        .modal-close {
            background: rgba(255, 59, 59, 0.2);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: #ff3b3b;
            transform: rotate(90deg);
        }

        .modal-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-wrap: wrap;
        }

        /* Carousel */
        .carousel {
            flex: 1;
            min-width: 250px;
            background: rgba(0, 0, 0, 0.3);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .carousel-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .carousel-main img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 12px;
        }

        .carousel-thumbnails {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .thumbnail.active {
            border-color: #ff3b3b;
            opacity: 1;
            transform: scale(1.05);
        }

        .thumbnail:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 59, 59, 0.7);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-btn:hover {
            background: #ff3b3b;
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-btn.prev {
            left: 10px;
        }

        .carousel-btn.next {
            right: 10px;
        }

        /* Product Info */
        .product-info {
            flex: 1;
            min-width: 250px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .product-info-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }

        .product-info-rarity {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            width: fit-content;
        }

        .product-info-hero {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .product-info-description {
            color: #cbd5e1;
            line-height: 1.6;
            margin: 0.5rem 0;
        }

        .product-info-price {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff8c00 0%, #ff3b3b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0.5rem 0;
        }

        .modal-add-to-cart {
            background: linear-gradient(135deg, #ff3b3b 0%, #cc2b2b 100%);
            border: none;
            padding: 1rem;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
        }

        .modal-add-to-cart:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 59, 59, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .catalog-title {
                font-size: 1.8rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .products {
                gap: 1rem;
            }
            
            .nav-content {
                justify-content: center;
                gap: 1rem;
            }
            
            .filters {
                justify-content: center;
            }

            .modal-body {
                flex-direction: column;
            }

            .carousel-main img {
                max-height: 200px;
            }

            .product-info {
                max-height: 300px;
            }
        }
    </style>
</head>

    // Переменные для модального окна и фильтрации
    let currentProduct = null;
    let currentImageIndex = 0;
    let currentFilter = 'all';

    // Функция показа уведомления
    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `✅ ${message}`;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.remove();
        }, 3000);
    }

    // Функция добавления в корзину
    function addToCart(productId, name, price) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        
        const existingItem = cart.find(item => item.name === name);
        
        if (existingItem) {
            existingItem.quantity = (existingItem.quantity || 1) + 1;
            showToast(`${name} добавлен ещё раз! Теперь в корзине ${existingItem.quantity} шт.`);
        } else {
            cart.push({ 
                name: name, 
                price: price,
                quantity: 1,
                id: productId
            });
            showToast(`${name} добавлен в корзину!`);
        }
        
        localStorage.setItem("cart", JSON.stringify(cart));
        
        const buttons = document.querySelectorAll('.add-to-cart');
        buttons.forEach(btn => {
            if (btn.getAttribute('data-name') === name) {
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    btn.style.transform = '';
                }, 200);
            }
        });
    }

    // Получение цвета для редкости
    function getRarityColor(rarity) {
        const colors = {
            'Arcana': '#ff3b3b',
            'Immortal': '#ff8c00',
            'Legendary': '#ffd700',
            'Mythical': '#c586c0'
        };
        return colors[rarity] || '#94a3b8';
    }

    // Получение иконки для редкости
    function getRarityIcon(rarity) {
        const icons = {
            'Arcana': '✨',
            'Immortal': '💀',
            'Legendary': '⭐',
            'Mythical': '🪶'
        };
        return icons[rarity] || '🎮';
    }

    // Открытие модального окна
    function openModal(product) {
        currentProduct = product;
        currentImageIndex = 0;
        
        document.getElementById('modalName').innerHTML = `${product.icon} ${product.name}`;
        document.getElementById('modalRarity').textContent = product.rarity;
        document.getElementById('modalRarity').style.background = getRarityColor(product.rarity);
        document.getElementById('modalRarity').style.color = '#1a1a2e';
        document.getElementById('modalHero').textContent = product.hero;
        document.getElementById('modalDescription').textContent = product.fullDescription;
        document.getElementById('modalPrice').innerHTML = `${product.price.toLocaleString('ru-RU')} ₽`;
        
        updateCarousel();
        
        document.getElementById('modalOverlay').classList.add('active');
    }

    // Обновление карусели
    function updateCarousel() {
        if (!currentProduct) return;
        
        const mainImg = document.getElementById('modalImage');
        const thumbnailsContainer = document.getElementById('thumbnails');
        
        mainImg.src = currentProduct.images[currentImageIndex];
        
        thumbnailsContainer.innerHTML = '';
        currentProduct.images.forEach((img, index) => {
            const thumb = document.createElement('img');
            thumb.src = img;
            thumb.className = 'thumbnail';
            if (index === currentImageIndex) thumb.classList.add('active');
            thumb.onclick = () => {
                currentImageIndex = index;
                updateCarousel();
            };
            thumbnailsContainer.appendChild(thumb);
        });
    }

    // Закрытие модального окна
    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
        currentProduct = null;
    }

    // Рендер товаров с фильтрацией
    function renderProducts(filter = 'all') {
        const container = document.getElementById('products');
        
        let filteredProducts = products;
        if (filter !== 'all') {
            filteredProducts = products.filter(p => p.rarity === filter);
        }
        
        if (filteredProducts.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 4rem;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
                    <h3>Предметы не найдены</h3>
                    <p style="color: #94a3b8;">Попробуйте выбрать другую категорию</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = filteredProducts.map(product => `
            <div class="card" onclick="openModal(${JSON.stringify(product).replace(/"/g, '&quot;')})">
                <div class="rare-badge" style="background: ${getRarityColor(product.rarity)}; color: #1a1a2e;">
                    ${getRarityIcon(product.rarity)} ${product.rarity}
                </div>
                <img class="card-image" src="${product.image}" alt="${product.name}" loading="lazy">
                <div class="card-content">
                    <h3 class="card-title">${product.icon} ${product.name}</h3>
                    <p class="card-desc">${product.description}</p>
                    <div class="price">
                        ${product.price.toLocaleString('ru-RU')} ₽
                    </div>
                    <button class="add-to-cart" 
                            data-name="${product.name}"
                            data-price="${product.price}"
                            data-id="${product.id}"
                            onclick="event.stopPropagation(); addToCart(${product.id}, '${product.name}', ${product.price})">
                        В корзину
                    </button>
                </div>
            </div>
        `).join('');
    }

    // Настройка фильтров
    function setupFilters() {
        const filterBtns = document.querySelectorAll('.filter-btn');
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentFilter = btn.getAttribute('data-filter');
                renderProducts(currentFilter);
            });
        });
    }

    // Навигация по карусели
    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentProduct && currentProduct.images.length > 0) {
            currentImageIndex = (currentImageIndex - 1 + currentProduct.images.length) % currentProduct.images.length;
            updateCarousel();
        }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentProduct && currentProduct.images.length > 0) {
            currentImageIndex = (currentImageIndex + 1) % currentProduct.images.length;
            updateCarousel();
        }
    });

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('modalOverlay')) closeModal();
    });
    
    document.getElementById('modalAddToCart').addEventListener('click', () => {
        if (currentProduct) {
            addToCart(currentProduct.id, currentProduct.name, currentProduct.price);
            closeModal();
        }
    });

    // Закрытие по ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    });

    // Инициализация страницы
    renderProducts();
    setupFilters();
</script>

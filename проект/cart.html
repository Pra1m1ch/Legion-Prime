<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | Dota 2 Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">🗡️ Dota 2 Skin Store</div>
        </div>
    </header>

    <nav class="nav">
        <div class="nav-content">
            <a href="index.html" class="nav-link">🏠 Главная</a>
            <a href="catalog.html" class="nav-link">📦 Каталог</a>
            <a href="cart.html" class="nav-link">🛒 Корзина</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="cart-title">🛍️ Моя корзина</h1>
        <div id="cart"></div>
    </div>

   <!-- Модальное окно оформления заказа -->
<div class="modal-overlay" id="orderModal">
    <div class="order-modal">
        <div class="modal-header">
            <span class="modal-title">💰 Оформление заказа</span>
            <button class="modal-close" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body" style="display: block;">
            <div class="order-summary" id="orderSummary" style=" text-align: center;"></div>
            <form id="orderForm" style="width: 100%;">
                <div class="form-group">
                    <label>💳 Номер карты</label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
                    <div class="error-message" id="cardError">Введите корректный номер карты (16 цифр)</div>
                </div>

                <div class="form-group">
                    <label>🎮 Логин Steam</label>
                    <input type="text" id="steamLogin" placeholder="Ваш логин в Steam">
                    <div class="error-message" id="steamError">Введите логин Steam</div>
                </div>

                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="example@mail.com">
                    <div class="error-message" id="emailError">Введите корректный email</div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreement">
                    <label>Я принимаю <a href="#" id="termsLink">пользовательское соглашение</a></label>
                </div>
                <div class="error-message" id="agreementError" style="margin-top: -10px; margin-bottom: 10px; text-align: center;">Подтвердите согласие</div>

                <button type="submit" class="submit-btn" style="display: block; width: 100%; margin: 0 auto;">✅ Подтвердить заказ</button>
            </form>
        </div>
    </div>
</div>

    <script src="cart-functions.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function removeFromCart(index) {
            if (confirm('Удалить товар из корзины?')) {
                cart.splice(index, 1);
                localStorage.setItem("cart", JSON.stringify(cart));
                renderCart();
            }
        }

        function updateQuantity(index, change) {
            if (cart[index]) {
                let newQty = (cart[index].quantity || 1) + change;
                if (newQty >= 1) {
                    cart[index].quantity = newQty;
                    localStorage.setItem("cart", JSON.stringify(cart));
                    renderCart();
                }
            }
        }

        function renderCart() {
            const container = document.getElementById("cart");
            if (cart.length === 0) {
                container.innerHTML = `<div class="empty-cart"><div class="empty-icon">🛒</div><h2 class="empty-title">Корзина пуста</h2><p class="empty-text">Похоже, вы еще не добавили ни одного товара</p><a href="catalog.html" class="continue-shopping">✨ Продолжить покупки</a></div>`;
                return;
            }
            let total = 0;
            let html = `<div class="cart-grid"><div class="cart-header"><div>Товар</div><div>Цена</div><div>Количество</div><div>Действие</div></div><div class="cart-items">`;
            cart.forEach((item, idx) => {
                let qty = item.quantity || 1;
                total += item.price * qty;
                html += `<div class="cart-item"><div class="product-name">${escapeHtml(item.name)}</div><div class="product-price">${formatPrice(item.price)}</div><div class="product-quantity"><button class="quantity-btn" onclick="updateQuantity(${idx}, -1)">−</button><span class="quantity-value">${qty}</span><button class="quantity-btn" onclick="updateQuantity(${idx}, 1)">+</button></div><div><button class="remove-btn" onclick="removeFromCart(${idx})">🗑️</button></div></div>`;
            });
            html += `</div><div class="cart-footer"><div><span class="total-label">Общая сумма:</span><span class="total-amount">${formatPrice(total)}</span></div><button class="checkout-btn" onclick="openOrderModal()">💳 Оформить заказ</button></div></div>`;
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatCardNumber(value) {
            let v = value.replace(/\s/g, '').replace(/[^0-9]/g, '');
            let parts = [];
            for (let i = 0; i < v.length && i < 16; i += 4) parts.push(v.substring(i, i+4));
            return parts.join(' ');
        }

        function openOrderModal() {
            const total = cart.reduce((s, item) => s + (item.price * (item.quantity || 1)), 0);
            document.getElementById('orderSummary').innerHTML = `<p>Количество товаров: ${cart.reduce((s, item) => s + (item.quantity || 1), 0)} шт.</p><p>Сумма к оплате: <strong>${formatPrice(total)}</strong></p>`;
            document.getElementById('cardNumber').value = '';
            document.getElementById('steamLogin').value = '';
            document.getElementById('email').value = '';
            document.getElementById('agreement').checked = false;
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
            document.getElementById('orderModal').classList.add('active');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        function validateForm() {
            let isValid = true;
            const cardNum = document.getElementById('cardNumber');
            const cardVal = cardNum.value.replace(/\s/g, '');
            if (!/^\d{16}$/.test(cardVal)) {
                cardNum.classList.add('error');
                document.getElementById('cardError').classList.add('show');
                isValid = false;
            } else {
                cardNum.classList.remove('error');
                document.getElementById('cardError').classList.remove('show');
            }
            const steam = document.getElementById('steamLogin');
            if (steam.value.trim() === '') {
                steam.classList.add('error');
                document.getElementById('steamError').classList.add('show');
                isValid = false;
            } else {
                steam.classList.remove('error');
                document.getElementById('steamError').classList.remove('show');
            }
            const email = document.getElementById('email');
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                email.classList.add('error');
                document.getElementById('emailError').classList.add('show');
                isValid = false;
            } else {
                email.classList.remove('error');
                document.getElementById('emailError').classList.remove('show');
            }
            const agree = document.getElementById('agreement');
            if (!agree.checked) {
                document.getElementById('agreementError').classList.add('show');
                isValid = false;
            } else {
                document.getElementById('agreementError').classList.remove('show');
            }
            return isValid;
        }

        document.getElementById('orderForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            if (validateForm()) {
                const total = cart.reduce((s, item) => s + (item.price * (item.quantity || 1)), 0);
                alert(`✅ ЗАКАЗ ОФОРМЛЕН!\n\nСумма: ${formatPrice(total)}\nЛогин Steam: ${document.getElementById('steamLogin').value}\nEmail: ${document.getElementById('email').value}\n\n(Демонстрационная форма)`);
                localStorage.removeItem("cart");
                cart = [];
                renderCart();
                closeOrderModal();
            }
        });

        document.getElementById('closeModalBtn')?.addEventListener('click', closeOrderModal);
        document.getElementById('orderModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('orderModal')) closeOrderModal(); });
        document.getElementById('termsLink')?.addEventListener('click', (e) => {
            e.preventDefault();
            alert("📋 ПОЛЬЗОВАТЕЛЬСКОЕ СОГЛАШЕНИЕ\n\n1. Все предметы виртуальные.\n2. Возврат средств возможен в течение 14 дней.\n(Демонстрационное соглашение)");
        });

        document.getElementById('cardNumber')?.addEventListener('input', function() { this.value = formatCardNumber(this.value); });

        cart = cart.map(item => { if (!item.quantity) item.quantity = 1; return item; });
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
    </script>
</body>
</html>

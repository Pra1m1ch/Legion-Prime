<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Dota 2 Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">🗡️ Dota 2 Skin Store</div>
        </div>
    </header>

    <nav class="nav">
        <div class="nav-content">
            <a href="index.html" class="nav-link">🏠 Главная</a>
            <a href="catalog.html" class="nav-link">📦 Каталог</a>
            <a href="cart.html" class="nav-link">🛒 Корзина</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="catalog-title">📦 Каталог предметов</h1>
        <p class="catalog-subtitle">Легендарные, бессмертные и аркана предметы из мира Dota 2</p>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все предметы</button>
            <button class="filter-btn" data-filter="Arcana">✨ Arcana</button>
            <button class="filter-btn" data-filter="Immortal">💀 Immortal</button>
            <button class="filter-btn" data-filter="Legendary">⭐ Legendary</button>
            <button class="filter-btn" data-filter="Mythical">🪶 Mythical</button>
        </div>

        <div class="products" id="products"></div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Детали предмета</span>
                <button class="modal-close" id="modalCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="carousel">
                    <button class="carousel-btn prev" id="prevBtn">‹</button>
                    <div class="carousel-main"><img id="modalImage" src=""></div>
                    <div class="carousel-thumbnails" id="thumbnails"></div>
                    <button class="carousel-btn next" id="nextBtn">›</button>
                </div>
                <div class="product-info">
                    <h2 class="product-info-name" id="modalName"></h2>
                    <span class="product-info-rarity" id="modalRarity"></span>
                    <div class="product-info-hero"><span>🎮 Герой:</span><span id="modalHero"></span></div>
                    <p class="product-info-description" id="modalDescription"></p>
                    <div class="product-info-price" id="modalPrice"></div>
                    <button class="modal-add-to-cart" id="modalAddToCart">🛒 Добавить в корзину</button>
                </div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script src="cart-functions.js"></script>
    <script src="modal.js"></script>
    <script>
        // Все товары уже загружены из products.js
        let currentFilter = 'all';

        function renderCatalog(filter = 'all') {
            const container = document.getElementById('products');
            let filtered = filter === 'all' ? allProducts : allProducts.filter(p => p.rarity === filter);
            
            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:4rem;"><div style="font-size:3rem;">🔍</div><h3>Предметы не найдены</h3></div>`;
                return;
            }
            
            container.innerHTML = filtered.map(p => `
                <div class="card" onclick="openModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <div class="rare-badge" style="background:${getRarityColor(p.rarity)}">${p.rarity}</div>
                    <img class="card-image" src="${p.image}">
                    <div class="card-content">
                        <h3 class="card-title">${p.icon || ''} ${p.name}</h3>
                        <p class="card-desc">${p.description}</p>
                        <div class="price">${formatPrice(p.price)}</div>
                        <button class="add-to-cart" onclick="event.stopPropagation(); addToCart(${p.id},'${p.name}',${p.price})">В корзину</button>
                    </div>
                </div>
            `).join('');
        }

        // Фильтры
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderCatalog(currentFilter);
            });
        });

        // Модальное окно
        document.getElementById('modalCloseBtn').onclick = closeModal;
        document.getElementById('modalOverlay').onclick = (e) => { if(e.target === document.getElementById('modalOverlay')) closeModal(); };
        document.getElementById('modalAddToCart').onclick = () => { if(currentProduct) { addToCart(currentProduct.id, currentProduct.name, currentProduct.price); closeModal(); } };
        document.getElementById('prevBtn').onclick = () => { if(currentProduct?.images?.length) { currentImageIndex = (currentImageIndex-1+currentProduct.images.length)%currentProduct.images.length; updateCarousel(); } };
        document.getElementById('nextBtn').onclick = () => { if(currentProduct?.images?.length) { currentImageIndex = (currentImageIndex+1)%currentProduct.images.length; updateCarousel(); } };

        renderCatalog();
    </script>
</body>
</html>
